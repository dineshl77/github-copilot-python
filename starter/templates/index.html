<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <button id="theme-toggle" class="theme-toggle" type="button">🌙 Dark Mode</button>
    <h1>Sudoku Game</h1>
    <div class="controls controls-top">
      <label for="difficulty-select">Difficulty</label>
      <select id="difficulty-select">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <div id="sudoku-board"></div>
    <div id="timer" aria-live="polite">00:00</div>
    <div class="controls action-row">
      <button id="new-game">New Game</button>
      <button id="check-solution">Check Solution</button>
      <button id="hint-button">Hint</button>
      <span id="message"></span>
    </div>
    <div id="leaderboard" class="leaderboard">
      <h2>Top 10 Leaderboard</h2>
      <div class="leaderboard-table-wrap">
        <table class="leaderboard-table" aria-label="Top 10 leaderboard">
          <thead>
            <tr>
              <th scope="col">Rank</th>
              <th scope="col">Name</th>
              <th scope="col">Time</th>
              <th scope="col">Difficulty</th>
              <th scope="col">Hints</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
